<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" role="img" aria-label="竞品猫多通道推送卡片样例">
  <!-- 聊天界面背景（微信风浅灰） -->
  <rect width="360" height="400" fill="#EDEDED"/>
  <!-- 时间戳 -->
  <text x="180" y="30" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#94A3B8">上午 9:41</text>

  <!-- 品牌头像（teal 圆 + 白猫图形） -->
  <circle cx="30" cy="78" r="20" fill="#0D9488"/>
  <g transform="translate(17,65) scale(0.40)">
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 8 L11 22 C11 38 20 54 32 54 C44 54 53 38 53 22 L48 8 L40 18 L24 18 Z"/>
      <circle cx="24" cy="34" r="4.6"/>
      <circle cx="40" cy="34" r="4.6"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="24" cy="34" r="2"/>
      <circle cx="40" cy="34" r="2"/>
    </g>
  </g>

  <!-- 消息气泡 -->
  <rect x="62" y="52" width="284" height="232" rx="14" fill="#FFFFFF"/>
  <!-- 气泡小尾巴 -->
  <path d="M62 66 L52 78 L62 86 Z" fill="#FFFFFF"/>

  <!-- 类型徽章：红色降价三角 -->
  <path d="M78 66 L90 66 L84 76 Z" fill="#DC2626"/>
  <text x="96" y="75" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#0F172A">竞品降价提醒</text>
  <text x="330" y="75" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#94A3B8">5分钟前</text>

  <!-- 商品名（一行截断） -->
  <text x="78" y="102" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#475569">冰丝防晒衣女防紫外线薄款透气外套</text>

  <!-- 价格：旧价→新价 -->
  <text x="78" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#94A3B8" style="text-decoration:line-through">¥39.90</text>
  <text x="132" y="132" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#94A3B8">→</text>
  <text x="152" y="136" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#DC2626" font-variant-numeric="tabular-nums">¥19.90</text>

  <!-- 涨跌幅 + 销量 + 平台 -->
  <rect x="78" y="148" width="52" height="20" rx="10" fill="#FEF2F2"/>
  <text x="104" y="162" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="600" fill="#DC2626">跌 33.4%</text>
  <text x="140" y="162" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748B">已拼 2.3万件</text>
  <rect x="256" y="148" width="44" height="20" rx="4" fill="#FFF1F0"/>
  <text x="278" y="162" text-anchor="middle" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#E02E24">拼多多</text>

  <!-- unicode 迷你折线（降价趋势，红色小柱） -->
  <g fill="#DC2626">
    <rect x="78" y="182" width="12" height="26" rx="2"/>
    <rect x="94" y="186" width="12" height="22" rx="2"/>
    <rect x="110" y="190" width="12" height="18" rx="2"/>
    <rect x="126" y="196" width="12" height="12" rx="2"/>
    <rect x="142" y="200" width="12" height="8" rx="2"/>
    <rect x="158" y="198" width="12" height="10" rx="2"/>
    <rect x="174" y="204" width="12" height="4" rx="2"/>
  </g>
  <text x="200" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94A3B8">近7日价格 ▁▂▃▄▃▂</text>

  <!-- 分隔线 -->
  <line x1="78" y1="222" x2="330" y2="222" stroke="#E6EAF0" stroke-width="1"/>

  <!-- 直达链接 -->
  <text x="78" y="246" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#0D9488">点击查看竞品 ›</text>

  <!-- 品牌落款 -->
  <text x="78" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#94A3B8">竞品猫 PriceCat · 每30分钟自动监控</text>

  <!-- 下方一条被压低的历史消息（增加真实感） -->
  <rect x="62" y="300" width="284" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="76" cy="328" r="9" fill="#EA580C"/>
  <text x="76" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">↑</text>
  <text x="92" y="324" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#334155">销量突增提醒</text>
  <text x="92" y="344" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#64748B">24h 新增 480 件 · 点击查看 ›</text>
</svg>
